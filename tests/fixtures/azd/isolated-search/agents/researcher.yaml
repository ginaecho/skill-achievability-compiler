host: azure.ai.agent
kind: hosted
project: src/researcher
language: python
codeConfiguration:
  runtime: python_3_13
  entryPoint: main.py
description: the description from the include
protocols:
  - protocol: responses
    version: 2.0.0
  - protocol: a2a
    version: 0.3.0
env:
  AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  TOOLBOX_ENDPOINT: ${TOOLBOX_RESEARCH_TOOLS_MCP_ENDPOINT}
  NOT_A_SECRET_VALUE: plain-value-XYZ789
container:
  resources:
    cpu: '1.0'
    memory: 2Gi
uses:
  - ai-project
toolboxes:
  - research-tools
  - undeclared-tools
policies:
  - type: rai_policy
    raiPolicyName: ${RAI_POLICY_NAME}
  - type: rai_policy
    raiPolicyName: Microsoft.DefaultV2
