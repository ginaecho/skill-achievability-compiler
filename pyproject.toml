[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillc"
version = "0.3.0"
description = "Skill Achievability Compiler: decides whether the goal of an agent skill (SKILL.md / agent markdown) is achievable, sound for refutation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skill-achievability-compiler contributors" }]
dependencies = [
    "z3-solver>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.0", "ruff>=0.6"]
# the Agent Framework middleware adapter (skillc.integrations.agent_framework); mcp 2.x breaks
# agent-framework-core 1.19 (docs/HOSTED_AGENT.md, spike results), hence the pin
agent-framework = ["agent-framework-core>=1.19,<2", "mcp>=1.30,<2"]
# the runtime monitor as an MCP server (skillc monitor mcp), for hosts without hooks
mcp = ["mcp>=1.25,<2"]

[project.scripts]
skillc = "skillc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillc = ["data/profiles/*.json", "data/runtimes/*.json", "data/toolpolicy/*.json", "data/*.json",
          "data/env/*.json", "data/env/intents/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["runs", "docs", "paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "RET", "PIE", "PERF"]
ignore = [
    "PERF203",   # try/except in a loop is the clearest form for per-item fallbacks
    "PERF401",   # an explicit loop is kept where it reads better than a comprehension
    "SIM108",    # ternaries are used where they help, not mandated
    "SIM905",    # a word list is clearer as one "a b c".split() than as a long literal
]

[tool.ruff.lint.per-file-ignores]
# prompt texts are experiment data: their wording is fixed, not reflowed
"src/skillc/frontend/prompts.py" = ["E501"]
# tests and research scripts favour local readability over the package rules
"tests/*" = ["E402", "E501", "E731", "E741", "B023", "B904", "B905", "SIM", "RET", "PERF", "UP", "C4", "PIE"]
"scripts/*" = ["E402", "E501", "E731", "E741", "B007", "B023", "B904", "B905", "F841", "SIM", "RET", "PERF", "UP", "C4", "PIE"]
"corpus/*" = ["E402", "E501"]
