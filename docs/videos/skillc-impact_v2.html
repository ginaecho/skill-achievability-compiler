<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillC | Per-skill savings</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #091322; color: #eef7ff; font-family: "Segoe UI", sans-serif; }
    main { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 18px; padding: 20px; }
    canvas { display: block; width: 100%; max-width: 1600px; min-width: 0; height: auto; margin: auto; border-radius: 12px; }
    nav { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 16px; }
    button { background: #172c40; color: #eef7ff; border: 1px solid #54708e; border-radius: 6px; padding: 9px 18px; font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #89e3b5; outline-offset: 3px; }
    input { width: min(40vw, 480px); accent-color: #89e3b5; }
    output { color: #afc3d5; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <canvas id="scene" width="1920" height="1080" role="img"
      aria-label="Per-skill savings across 30 tested unsuccessful agent runs in 8 categories. Without SkillC: 14,773,187 measured runtime tokens. With SkillC: 209,195 compaction tokens, combining 54,039 measured and 155,156 estimated. Total reduction: 98.58 percent. PDF 86.02 percent; XLSX 84.73; DOCX 81.89; Bulk RNA-seq 98.93; Data-quality auditor 97.82; Google Workspace CLI 99.31; Kubernetes operator 99.38; Writing skills 98.93. Savings describe this unsuccessful-run sample, not every task."></canvas>
    <nav aria-label="Animation playback">
      <button id="play" type="button">Play</button>
      <button id="replay" type="button">Replay</button>
      <label for="scrub">Timeline</label>
      <input id="scrub" type="range" min="0" max="12" step="0.01" value="0">
      <output id="time" for="scrub">0.00 / 12.00 s</output>
    </nav>
  </main>
  <script src="./skillc-impact_v2.js"></script>
</body>
</html>
