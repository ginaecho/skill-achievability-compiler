<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillC | The code behind IMPOSSIBLE</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #080e1c; color: #edf6ff; font-family: "Segoe UI", sans-serif; }
    main { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 18px; padding: 20px; }
    canvas { display: block; width: 100%; max-width: 1600px; min-width: 0; height: auto; margin: auto; border-radius: 12px; }
    nav { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 16px; }
    button { background: #172c40; color: #edf6ff; border: 1px solid #54708e; border-radius: 6px; padding: 9px 18px; font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #5be3ed; outline-offset: 3px; }
    input { width: min(40vw, 480px); accent-color: #5be3ed; }
    output, .note { color: #a9bed1; font-size: 14px; }
    .note { text-align: center; margin: 0; }
  </style>
</head>
<body>
  <main>
    <canvas id="scene" width="1920" height="1080" role="img"
      aria-label="A code editor shows the actual meeting pack and excerpts from SkillC's Python checker. The terminal replays captured output: IMPOSSIBLE, reason GOAL_UNSAT, frontier invited_all, exit code 1. No declared capability can make invited_all true, so scheduled AND invited_all cannot hold."></canvas>
    <nav aria-label="Animation playback">
      <button id="play" type="button">Play</button>
      <button id="replay" type="button">Replay</button>
      <label for="scrub">Timeline</label>
      <input id="scrub" type="range" min="0" max="18" step="0.01" value="0">
      <output id="time" for="scrub">0.00 / 18.00 s</output>
    </nav>
    <p class="note">Animated replay of real local SkillC output. Hand-authored demo pack, not a live mailbox probe. Timing is edited for explanation.</p>
  </main>
  <script src="./meeting-terminal-evidence.js"></script>
  <script src="./skillc-meeting-terminal.js"></script>
</body>
</html>
