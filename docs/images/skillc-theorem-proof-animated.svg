<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Animated SkillC theorem proof</title>
  <desc id="desc">An animated formal pack enters an abstract transition system. The goal is shown unreachable, the Coq proof completes, and a certified impossible verdict appears.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243e"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#4be0a6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4be0a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#55d8ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4be0a6"/>
    </marker>
    <style>
      .title { font: 800 54px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 20px Inter, Segoe UI, Arial, sans-serif; fill: #a9bed1; }
      .eyebrow { font: 700 14px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #55d8ff; }
      .cardTitle { font: 700 25px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .body { font: 400 16px Inter, Segoe UI, Arial, sans-serif; fill: #b9c9d8; }
      .mono { font: 600 17px Consolas, Cascadia Mono, monospace; fill: #ddf9ff; }
      .step { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #effaf6; }
      .final { font: 800 48px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; letter-spacing: 1px; }
      .finalAccent { fill: #4be0a6; }

      .pack { animation: packIn 8s cubic-bezier(.2,.8,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
      .flowOne { stroke-dasharray: 360; stroke-dashoffset: 360; animation: drawOne 8s ease-in-out infinite; }
      .model { opacity: 0; animation: modelIn 8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .state { opacity: 0; animation: statesIn 8s ease-out infinite; }
      .searchPath { stroke-dasharray: 520; stroke-dashoffset: 520; animation: search 8s ease-in-out infinite; }
      .blocked { opacity: 0; animation: blockedIn 8s cubic-bezier(.2,.8,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
      .proofLine { stroke-dasharray: 440; stroke-dashoffset: 440; animation: proofDraw 8s ease-in-out infinite; }
      .shield { opacity: 0; animation: shieldIn 8s cubic-bezier(.2,1.4,.4,1) infinite; transform-box: fill-box; transform-origin: center; }
      .verdict { opacity: 0; animation: verdictIn 8s cubic-bezier(.2,.8,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { opacity: 0; animation: pulse 8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .timeline { stroke-dasharray: 1320; stroke-dashoffset: 1320; animation: timeline 8s linear infinite; }

      @keyframes packIn {
        0%, 5% { opacity: 0; transform: translateX(-45px) scale(.94); }
        13%, 88% { opacity: 1; transform: translateX(0) scale(1); }
        96%, 100% { opacity: 0; transform: translateX(-20px) scale(.97); }
      }
      @keyframes drawOne {
        0%, 13% { stroke-dashoffset: 360; opacity: 0; }
        24%, 88% { stroke-dashoffset: 0; opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes modelIn {
        0%, 20% { opacity: 0; transform: scale(.94); }
        28%, 88% { opacity: 1; transform: scale(1); }
        96%, 100% { opacity: 0; transform: scale(.97); }
      }
      @keyframes statesIn {
        0%, 26% { opacity: 0; }
        34%, 88% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes search {
        0%, 32% { stroke-dashoffset: 520; opacity: 0; }
        48%, 88% { stroke-dashoffset: 0; opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes blockedIn {
        0%, 45% { opacity: 0; transform: scale(.4) rotate(-16deg); }
        54%, 88% { opacity: 1; transform: scale(1) rotate(0); }
        96%, 100% { opacity: 0; transform: scale(.7); }
      }
      @keyframes proofDraw {
        0%, 52% { stroke-dashoffset: 440; opacity: 0; }
        64%, 88% { stroke-dashoffset: 0; opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes shieldIn {
        0%, 61% { opacity: 0; transform: scale(.45) rotate(-8deg); }
        70%, 88% { opacity: 1; transform: scale(1) rotate(0); }
        96%, 100% { opacity: 0; transform: scale(.8); }
      }
      @keyframes verdictIn {
        0%, 68% { opacity: 0; transform: translateY(28px) scale(.97); }
        77%, 88% { opacity: 1; transform: translateY(0) scale(1); }
        96%, 100% { opacity: 0; transform: translateY(12px) scale(.98); }
      }
      @keyframes pulse {
        0%, 68% { opacity: 0; transform: scale(.6); }
        74% { opacity: .8; transform: scale(.8); }
        88% { opacity: 0; transform: scale(1.45); }
        100% { opacity: 0; }
      }
      @keyframes timeline {
        0% { stroke-dashoffset: 1320; }
        88%, 100% { stroke-dashoffset: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .pack, .model, .state, .blocked, .shield, .verdict, .pulse,
        .flowOne, .searchPath, .proofLine, .timeline {
          animation: none !important;
          opacity: 1;
          transform: none;
          stroke-dashoffset: 0;
        }
        .pulse { opacity: .18; }
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="90" r="280" fill="#174a6d" opacity=".2"/>
  <circle cx="95" cy="850" r="300" fill="#0b5849" opacity=".14"/>

  <text x="72" y="80" class="title">Watch a refutation become a proof.</text>
  <text x="72" y="116" class="subtitle">The animation follows the theorem implemented in proof/SkillAchievability.v.</text>

  <line x1="140" y1="154" x2="1460" y2="154" stroke="#203e55" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="154" x2="1460" y2="154" class="timeline" stroke="#55d8ff" stroke-width="4" stroke-linecap="round"/>

  <g class="pack" filter="url(#shadow)">
    <rect x="72" y="222" width="332" height="260" rx="24" fill="#142e47" stroke="#4b789b" stroke-width="2"/>
    <text x="104" y="261" class="eyebrow">01 · FORMAL INPUT</text>
    <text x="104" y="304" class="cardTitle">Achievability pack</text>
    <text x="104" y="337" class="body">Capabilities Γ</text>
    <text x="104" y="365" class="body">Protocol G</text>
    <text x="104" y="393" class="body">Goal φ</text>
    <text x="104" y="421" class="body">Initial world W₀</text>
    <rect x="104" y="442" width="268" height="24" rx="7" fill="#091827" stroke="#2a5874"/>
    <text x="238" y="459" text-anchor="middle" style="font:600 12px Consolas,Cascadia Mono,monospace;fill:#d7f6ff">schema validated</text>
  </g>

  <path d="M404 352H502" class="flowOne" stroke="#55d8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g class="model" filter="url(#shadow)">
    <rect x="522" y="194" width="556" height="316" rx="26" fill="#0c2435" stroke="#55d8ff" stroke-width="2"/>
    <text x="554" y="233" class="eyebrow">02 · ABSTRACT REACHABILITY</text>
    <text x="554" y="276" class="cardTitle">Checker explores every admitted path</text>

    <g class="state">
      <circle cx="602" cy="371" r="28" fill="#1b5373" stroke="#75dfff" stroke-width="2"/>
      <text x="602" y="378" text-anchor="middle" class="step">s₀</text>
      <circle cx="740" cy="329" r="28" fill="#1b5373" stroke="#75dfff" stroke-width="2"/>
      <text x="740" y="336" text-anchor="middle" class="step">s₁</text>
      <circle cx="740" cy="423" r="28" fill="#1b5373" stroke="#75dfff" stroke-width="2"/>
      <text x="740" y="430" text-anchor="middle" class="step">s₂</text>
      <circle cx="882" cy="371" r="28" fill="#1b5373" stroke="#75dfff" stroke-width="2"/>
      <text x="882" y="378" text-anchor="middle" class="step">s₃</text>
      <circle cx="1000" cy="371" r="33" fill="#381c25" stroke="#ff6b6b" stroke-width="2"/>
      <text x="1000" y="378" text-anchor="middle" class="step">goal</text>
      <path d="M630 365L711 337M630 378L711 415M768 329L854 362M768 423L854 381M910 371H965"
            class="searchPath" stroke="#4be0a6" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <g class="blocked">
      <circle cx="1000" cy="371" r="48" fill="#5b1f2d" opacity=".55" filter="url(#glow)"/>
      <path d="M977 348l46 46M1023 348l-46 46" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <text x="800" y="476" text-anchor="middle" class="mono">¬∃a. reach(α(W₀), a) ∧ abstract_goal(a)</text>
    </g>
  </g>

  <path d="M1078 352H1172" class="proofLine" stroke="#4be0a6" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>

  <g class="shield" filter="url(#shadow)">
    <rect x="1192" y="222" width="336" height="260" rx="24" fill="#0e332d" stroke="#4be0a6" stroke-width="2"/>
    <text x="1224" y="261" class="eyebrow" fill="#4be0a6">03 · COQ THEOREM</text>
    <path d="M1304 307l56-25 56 25v56c0 44-24 75-56 92-32-17-56-48-56-92z" fill="#14694f" stroke="#63efb5" stroke-width="3" filter="url(#glow)"/>
    <path d="M1335 362l17 17 35-41" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1360" y="449" text-anchor="middle" class="mono">refutation_sound</text>
  </g>

  <circle cx="800" cy="706" r="220" class="pulse" fill="url(#halo)"/>

  <g class="verdict" filter="url(#shadow)">
    <rect x="244" y="584" width="1112" height="208" rx="32" fill="#0b3029" stroke="#4be0a6" stroke-width="3"/>
    <text x="800" y="644" text-anchor="middle" class="eyebrow" fill="#4be0a6">MECHANIZED · ZERO AXIOMS · SOUND FOR REFUTATION</text>
    <text x="800" y="706" text-anchor="middle" class="final">IMPOSSIBLE means <tspan class="finalAccent">no represented run can succeed.</tspan></text>
    <text x="800" y="752" text-anchor="middle" class="body">Not an LLM opinion. Not a probability. A theorem-backed blocking frontier.</text>
  </g>

  <text x="800" y="854" text-anchor="middle" class="body">Scope: the formal pack, declared capabilities, and frame assumption.</text>
</svg>
