<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SkillC is backed by a mechanized Proof</title>
  <desc id="desc">The Coq refutation soundness theorem proves that if the abstract system cannot reach a goal, no concrete run represented by the model can reach that goal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243e"/>
    </linearGradient>
    <linearGradient id="proofCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103d35"/>
      <stop offset="1" stop-color="#092923"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#55d8ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4be0a6"/>
    </marker>
    <style>
      .title { font: 800 52px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .accent { fill: #4be0a6; }
      .subtitle { font: 400 20px Inter, Segoe UI, Arial, sans-serif; fill: #a9bed1; }
      .eyebrow { font: 700 14px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #55d8ff; }
      .cardTitle { font: 700 24px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .body { font: 400 16px Inter, Segoe UI, Arial, sans-serif; fill: #b9c9d8; }
      .small { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #94abc0; }
      .mono { font: 600 17px Consolas, Cascadia Mono, monospace; fill: #ddf9ff; }
      .formula { font: 600 22px Cambria Math, STIX Two Math, Georgia, serif; fill: #f2fbff; }
      .proofTitle { font: 800 28px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .proofBody { font: 500 18px Inter, Segoe UI, Arial, sans-serif; fill: #c8eade; }
      .metric { font: 800 30px Inter, Segoe UI, Arial, sans-serif; fill: #4be0a6; }
      .metricLabel { font: 600 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 1px; fill: #b8cfc6; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="270" fill="#174a6d" opacity=".2"/>
  <circle cx="80" cy="840" r="300" fill="#0b5849" opacity=".15"/>

  <text x="72" y="82" class="title">This is a <tspan class="accent">Proof</tspan>, not a prediction.</text>
  <text x="72" y="119" class="subtitle">SkillC’s strongest verdict is a proof-backed refutation over the declared model.</text>

  <rect x="72" y="158" width="1456" height="362" rx="28" fill="#0a1929" stroke="#2e536f" stroke-width="2"/>
  <text x="104" y="196" class="eyebrow">THE SOUNDNESS ARGUMENT</text>

  <g filter="url(#shadow)">
    <rect x="104" y="229" width="348" height="202" rx="20" fill="#142e47" stroke="#4b789b" stroke-width="2"/>
    <circle cx="150" cy="273" r="21" fill="#24597e"/>
    <text x="150" y="280" text-anchor="middle" style="font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#fff">W</text>
    <text x="186" y="280" class="cardTitle">Concrete execution</text>
    <text x="136" y="321" class="body">Every runtime step represented</text>
    <text x="136" y="347" class="body">by the declared capabilities</text>
    <rect x="136" y="374" width="284" height="34" rx="9" fill="#091827" stroke="#2a5874"/>
    <text x="278" y="397" text-anchor="middle" class="formula">w₀ → w₁ → ··· → goal</text>
  </g>

  <path d="M452 330H570" stroke="#55d8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="590" y="229" width="420" height="202" rx="20" fill="#142e47" stroke="#55d8ff" stroke-width="2"/>
    <circle cx="636" cy="273" r="21" fill="#14799b"/>
    <text x="636" y="280" text-anchor="middle" style="font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#fff">A</text>
    <text x="672" y="280" class="cardTitle">Abstract checker model</text>
    <text x="622" y="321" class="body">Step simulation preserves runs</text>
    <text x="622" y="347" class="body">Goal simulation preserves success</text>
    <rect x="622" y="374" width="356" height="34" rx="9" fill="#091827" stroke="#2a667f"/>
    <text x="800" y="397" text-anchor="middle" class="formula">α(w₀) →* a ∧ abstract_goal(a)</text>
  </g>

  <path d="M1010 330H1128" stroke="#4be0a6" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="1148" y="229" width="348" height="202" rx="20" fill="#321c25" stroke="#ff6b6b" stroke-width="2"/>
    <circle cx="1194" cy="273" r="21" fill="#a93d4b"/>
    <path d="M1186 265l16 16M1202 265l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="1230" y="280" class="cardTitle">Goal unreachable</text>
    <text x="1180" y="321" class="body">No abstract witness exists</text>
    <text x="1180" y="347" class="body">therefore no concrete witness exists</text>
    <rect x="1180" y="374" width="284" height="34" rx="9" fill="#1d1016" stroke="#84414a"/>
    <text x="1322" y="397" text-anchor="middle" class="formula">¬∃w. reach(w₀,w) ∧ goal(w)</text>
  </g>

  <rect x="104" y="459" width="1392" height="36" rx="10" fill="#0c2432" stroke="#2f6075"/>
  <text x="800" y="483" text-anchor="middle" class="mono">If the over-approximation still cannot reach the goal, the real system represented by it cannot either.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="558" width="1012" height="260" rx="28" fill="url(#proofCard)" stroke="#4be0a6" stroke-width="2"/>
    <path d="M126 617l54-24 54 24v53c0 42-23 72-54 88-31-16-54-46-54-88z" fill="#14694f" stroke="#63efb5" stroke-width="3" filter="url(#glow)"/>
    <path d="M157 669l16 16 34-40" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="274" y="618" class="eyebrow" fill="#4be0a6">MECHANIZED IN COQ</text>
    <text x="274" y="661" class="proofTitle">Proved refutation_sound</text>
    <text x="274" y="698" class="proofBody">An IMPOSSIBLE verdict cannot be a false refutation</text>
    <text x="274" y="729" class="proofBody">relative to the declared capabilities and frame assumption.</text>
    <rect x="274" y="756" width="778" height="36" rx="9" fill="#071f1b" stroke="#27745f"/>
    <text x="663" y="780" text-anchor="middle" class="mono">proof/SkillAchievability.v · T1 · refutation_sound</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1120" y="558" width="408" height="260" rx="28" fill="#0b1928" stroke="#355b76" stroke-width="2"/>
    <text x="1152" y="596" class="eyebrow">PROOF AUDIT</text>
    <text x="1170" y="660" class="metric">0</text>
    <text x="1232" y="660" class="metricLabel">AXIOMS</text>
    <line x1="1152" y1="684" x2="1496" y2="684" stroke="#27445d"/>
    <text x="1170" y="731" class="metric">3</text>
    <text x="1232" y="731" class="metricLabel">CORE THEOREMS: T1 · T2 · T3</text>
    <line x1="1152" y1="755" x2="1496" y2="755" stroke="#27445d"/>
    <text x="1170" y="796" class="mono">Print Assumptions</text>
  </g>

</svg>
