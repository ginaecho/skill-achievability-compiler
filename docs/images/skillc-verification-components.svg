<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SkillC verification components</title>
  <desc id="desc">SkillC components showing the schema-gated formal pack, protocol analysis, Z3 reachability engine, Coq assurance layer, and evidence-carrying verdicts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243e"/>
    </linearGradient>
    <linearGradient id="trusted" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3a35"/>
      <stop offset="1" stop-color="#092825"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#55d8ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#4be0a6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#f2bb4b"/>
    </marker>
    <style>
      .title { font: 800 46px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 19px Inter, Segoe UI, Arial, sans-serif; fill: #a9bed1; }
      .eyebrow { font: 700 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #55d8ff; }
      .panelTitle { font: 700 24px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .cardTitle { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .body { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #b8c8d8; }
      .small { font: 500 12px Inter, Segoe UI, Arial, sans-serif; fill: #94abc0; }
      .mono { font: 600 15px Consolas, Cascadia Mono, monospace; fill: #dcf7ff; }
      .item { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #ccdae6; }
      .number { font: 800 15px Inter, Segoe UI, Arial, sans-serif; fill: #fff; }
      .verdict { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1455" cy="60" r="280" fill="#174a6d" opacity=".19"/>
  <circle cx="60" cy="860" r="300" fill="#0b5849" opacity=".14"/>

  <text x="64" y="68" class="title">SkillC verification stack</text>
  <text x="64" y="102" class="subtitle">A small trusted decision pipeline, backed by a mechanized soundness core and explicit evidence.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="142" width="300" height="268" rx="24" fill="#132d46" stroke="#4a7698" stroke-width="2"/>
    <rect x="92" y="122" width="174" height="36" rx="18" fill="#aa710d"/>
    <text x="179" y="146" text-anchor="middle" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:1px">UNTRUSTED FRONT END</text>
    <text x="94" y="194" class="panelTitle">Skill compiler</text>

    <rect x="94" y="222" width="240" height="64" rx="12" fill="#0b1b2b" stroke="#335b77"/>
    <text x="114" y="249" class="cardTitle">Natural language</text>
    <text x="114" y="271" class="body">SKILL.md · agent markdown</text>

    <path d="M214 286V312" stroke="#f2bb4b" stroke-width="3" marker-end="url(#arrowAmber)"/>

    <rect x="94" y="320" width="240" height="64" rx="12" fill="#2e2517" stroke="#c89331"/>
    <text x="114" y="347" class="cardTitle">Compaction</text>
    <text x="114" y="369" class="body">Parser or optional LLM</text>
  </g>

  <path d="M364 276H424" stroke="#55d8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="444" y="142" width="332" height="268" rx="24" fill="#10283d" stroke="#55d8ff" stroke-width="2"/>
    <rect x="476" y="122" width="152" height="36" rx="18" fill="#14799b"/>
    <text x="552" y="146" text-anchor="middle" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:1px">FORMAL INTERFACE</text>
    <text x="476" y="194" class="panelTitle">Schema-gated pack</text>

    <rect x="476" y="222" width="268" height="42" rx="10" fill="#081722" stroke="#2b617b"/>
    <text x="610" y="248" text-anchor="middle" class="mono">⟨ Γ, G, φ, W₀, {Sₚ} ⟩</text>

    <circle cx="492" cy="295" r="11" fill="#21789b"/>
    <text x="492" y="300" text-anchor="middle" class="number">1</text>
    <text x="516" y="300" class="item">Validate pack structure</text>
    <circle cx="492" cy="329" r="11" fill="#21789b"/>
    <text x="492" y="334" text-anchor="middle" class="number">2</text>
    <text x="516" y="334" class="item">Normalize formula language</text>
    <circle cx="492" cy="363" r="11" fill="#21789b"/>
    <text x="492" y="368" text-anchor="middle" class="number">3</text>
    <text x="516" y="368" class="item">Bind profile and digest</text>
  </g>

  <path d="M776 276H836" stroke="#4be0a6" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="856" y="142" width="680" height="268" rx="24" fill="url(#trusted)" stroke="#4be0a6" stroke-width="2"/>
    <rect x="1094" y="122" width="204" height="36" rx="18" fill="#14735c"/>
    <text x="1196" y="146" text-anchor="middle" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:1px">DETERMINISTIC TRUSTED CORE</text>
    <text x="888" y="194" class="panelTitle">Executable checker</text>

    <rect x="888" y="222" width="292" height="158" rx="16" fill="#0b2525" stroke="#338b73"/>
    <circle cx="918" cy="252" r="14" fill="#1a8062"/>
    <text x="918" y="257" text-anchor="middle" class="number">A</text>
    <text x="946" y="258" class="cardTitle">Protocol analysis</text>
    <text x="912" y="292" class="item">Participant agreement</text>
    <text x="912" y="318" class="item">Projection and branch merge</text>
    <text x="912" y="344" class="item">Direct role conformance</text>
    <text x="912" y="367" class="small">session.py · MPST-style types</text>

    <path d="M1180 301H1212" stroke="#4be0a6" stroke-width="3" marker-end="url(#arrowGreen)"/>

    <rect x="1228" y="222" width="276" height="158" rx="16" fill="#0b2525" stroke="#338b73"/>
    <circle cx="1258" cy="252" r="14" fill="#1a8062"/>
    <text x="1258" y="257" text-anchor="middle" class="number">B</text>
    <text x="1286" y="258" class="cardTitle">Reachability engine</text>
    <text x="1252" y="292" class="item">STRIPS state transitions</text>
    <text x="1252" y="318" class="item">Guards and numeric effects</text>
    <text x="1252" y="344" class="item">QF-LIA queries through Z3</text>
    <text x="1252" y="367" class="small">checker.py · conservative UNKNOWN</text>
  </g>

  <path d="M1196 410V468" stroke="#4be0a6" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>

  <rect x="64" y="470" width="1472" height="234" rx="26" fill="#091827" stroke="#2d536d" stroke-width="2"/>
  <text x="94" y="504" class="eyebrow">MECHANIZED ASSURANCE AND IMPLEMENTATION EVIDENCE</text>

  <g filter="url(#shadow)">
    <rect x="94" y="534" width="418" height="138" rx="17" fill="#12322d" stroke="#4be0a6"/>
    <path d="M120 570l31-14 31 14v30c0 25-13 42-31 52-18-10-31-27-31-52z" fill="#14694f" stroke="#63efb5" stroke-width="2" filter="url(#glow)"/>
    <path d="M136 600l10 10 20-24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="202" y="565" class="cardTitle">Coq soundness core</text>
    <text x="202" y="593" class="item">T1 · refutation_sound</text>
    <text x="202" y="618" class="item">T2 · tolerance_sound</text>
    <text x="202" y="643" class="item">T3 · cap_monotone</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="536" y="534" width="418" height="138" rx="17" fill="#132b40" stroke="#4b789b"/>
    <circle cx="588" cy="586" r="31" fill="#1c5577" stroke="#64d7ff" stroke-width="2"/>
    <text x="588" y="594" text-anchor="middle" style="font:800 22px Inter,Segoe UI,Arial,sans-serif;fill:#fff">π</text>
    <text x="642" y="565" class="cardTitle">Communication safety</text>
    <text x="642" y="593" class="item">Direct typing and progress</text>
    <text x="642" y="618" class="item">Subject reduction</text>
    <text x="642" y="643" class="item">Session fidelity</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="978" y="534" width="528" height="138" rx="17" fill="#132b40" stroke="#4b789b"/>
    <circle cx="1030" cy="586" r="31" fill="#1c5577" stroke="#64d7ff" stroke-width="2"/>
    <path d="M1016 586h28M1030 572v28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="1084" y="565" class="cardTitle">Executable alignment</text>
    <text x="1084" y="593" class="item">Schema and regression tests</text>
    <text x="1084" y="618" class="item">Corpus soundness audit</text>
    <text x="1084" y="643" class="item">Print Assumptions: zero axioms</text>
  </g>

  <path d="M303 534V514H1048V410" stroke="#75a1bd" stroke-width="2" stroke-dasharray="8 7" fill="none"/>
  <text x="686" y="526" text-anchor="middle" class="small">mechanized specification and proof obligations</text>
  <path d="M1188 534V514H1358V410" stroke="#75a1bd" stroke-width="2" stroke-dasharray="8 7" fill="none"/>

  <path d="M800 704V752" stroke="#4be0a6" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="64" y="754" width="1472" height="102" rx="24" fill="#0b1928" stroke="#355b76" stroke-width="2"/>
    <text x="94" y="786" class="eyebrow">EVIDENCE-CARRYING VERDICTS</text>

    <rect x="94" y="801" width="420" height="38" rx="12" fill="#10372f" stroke="#4be0a6"/>
    <text x="116" y="826" class="verdict">ACHIEVABLE</text>
    <text x="250" y="826" class="body">witness path + deferred obligations</text>

    <rect x="538" y="801" width="420" height="38" rx="12" fill="#172f49" stroke="#6aa8df"/>
    <text x="560" y="826" class="verdict">UNKNOWN</text>
    <text x="672" y="826" class="body">fragment boundary + abstention reason</text>

    <rect x="982" y="801" width="524" height="38" rx="12" fill="#3a1d25" stroke="#ff6b6b"/>
    <text x="1004" y="826" class="verdict">IMPOSSIBLE</text>
    <text x="1135" y="826" class="body">reason code + blocking frontier + pack digest</text>
  </g>

  <text x="64" y="884" class="small">Honest boundary: Coq mechanizes the soundness framework; the Python checker is schema-gated and tested against that specification, not extracted from Coq.</text>
</svg>
