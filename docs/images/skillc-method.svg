<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SkillC method overview</title>
  <desc id="desc">A natural-language skill is compacted into a formal pack above a trust boundary. A deterministic checker below the boundary returns achievable, unknown, or impossible with evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243e"/>
    </linearGradient>
    <linearGradient id="cyanPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a42"/>
      <stop offset="1" stop-color="#0b1c30"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3a36"/>
      <stop offset="1" stop-color="#0a2629"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity=".42"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#42d6ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#48e0a4"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#8ea8c4"/>
    </marker>
    <style>
      .title { font: 700 44px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 20px Inter, Segoe UI, Arial, sans-serif; fill: #9eb3c9; }
      .eyebrow { font: 700 14px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #42d6ff; }
      .cardTitle { font: 700 25px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .body { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #b8c8d8; }
      .small { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #9eb3c9; }
      .mono { font: 600 17px Consolas, Cascadia Mono, monospace; fill: #d9f7ff; }
      .verdict { font: 700 23px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .verdictBody { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #c5d2df; }
      .check { font: 600 15px Inter, Segoe UI, Arial, sans-serif; fill: #d8e6f3; }
      .footer { font: 600 17px Inter, Segoe UI, Arial, sans-serif; fill: #d7e5f2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="90" r="260" fill="#163e5d" opacity=".22"/>
  <circle cx="150" cy="840" r="300" fill="#0d4c4a" opacity=".18"/>

  <text x="72" y="72" class="title">Compile agent skills before they run</text>
  <text x="72" y="108" class="subtitle">SkillC relocates uncertainty to one inspectable boundary, then makes a deterministic decision.</text>

  <rect x="72" y="142" width="1456" height="286" rx="26" fill="#0a1728" stroke="#27445f" stroke-width="2"/>
  <text x="102" y="178" class="eyebrow">SEMANTIC FRONT END · UNTRUSTED</text>

  <g filter="url(#shadow)">
    <rect x="106" y="215" width="342" height="154" rx="20" fill="url(#cyanPanel)" stroke="#4b6f8f" stroke-width="2"/>
    <rect x="130" y="239" width="46" height="56" rx="6" fill="#173d5d" stroke="#42d6ff"/>
    <path d="M142 253h22M142 264h22M142 275h16" stroke="#8eeaff" stroke-width="3" stroke-linecap="round"/>
    <text x="198" y="258" class="cardTitle">Natural-language skill</text>
    <text x="198" y="289" class="body">Goal, workflow, tools, roles</text>
    <text x="130" y="333" class="small">SKILL.md · agent markdown · formal JSON</text>
  </g>

  <path d="M448 292 H528" fill="none" stroke="#42d6ff" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <text x="466" y="273" class="small">parse</text>

  <g filter="url(#shadow)">
    <rect x="548" y="202" width="424" height="180" rx="20" fill="#251e12" stroke="#dba332" stroke-width="2"/>
    <rect x="692" y="184" width="136" height="34" rx="17" fill="#b87908"/>
    <text x="760" y="207" text-anchor="middle" style="font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:1px">UNTRUSTED</text>
    <text x="578" y="251" class="cardTitle">Semantic compaction</text>
    <text x="578" y="281" class="body">Deterministic parser or optional LLM</text>
    <rect x="578" y="309" width="364" height="42" rx="10" fill="#171c23" stroke="#66542e"/>
    <text x="760" y="336" text-anchor="middle" class="mono">prose  →  formal intermediate form</text>
  </g>

  <path d="M972 292 H1052" fill="none" stroke="#42d6ff" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <text x="987" y="273" class="small">validate</text>

  <g filter="url(#shadow)">
    <rect x="1072" y="202" width="418" height="180" rx="20" fill="url(#cyanPanel)" stroke="#42d6ff" stroke-width="2"/>
    <text x="1104" y="251" class="cardTitle">Schema-gated pack</text>
    <text x="1104" y="281" class="body">The exact object the checker decides</text>
    <rect x="1104" y="309" width="354" height="42" rx="10" fill="#071522" stroke="#2c607a"/>
    <text x="1281" y="336" text-anchor="middle" class="mono">⟨ Γ, G, goal, W₀, {Sₚ} ⟩</text>
  </g>

  <line x1="72" y1="468" x2="1528" y2="468" stroke="#7f94aa" stroke-width="2" stroke-dasharray="10 10"/>
  <rect x="1214" y="449" width="278" height="38" rx="19" fill="#15283d" stroke="#7f94aa"/>
  <text x="1353" y="474" text-anchor="middle" class="small">TRUST BOUNDARY</text>
  <text x="72" y="505" class="eyebrow" fill="#48e0a4">DETERMINISTIC CORE · TRUSTED</text>

  <path d="M1280 382 V520 H464 V555" fill="none" stroke="#8ea8c4" stroke-width="4" marker-end="url(#arrowGray)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="555" width="650" height="238" rx="24" fill="url(#greenPanel)" stroke="#48e0a4" stroke-width="2"/>
    <rect x="96" y="534" width="196" height="40" rx="20" fill="#14735c"/>
    <text x="194" y="560" text-anchor="middle" style="font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:1px">TRUSTED CHECKER</text>
    <text x="104" y="617" class="cardTitle">Proof-guided achievability analysis</text>
    <text x="104" y="648" class="body">Capability-guarded may-reachability over the declared world</text>

    <rect x="104" y="682" width="274" height="40" rx="10" fill="#123f3a" stroke="#2a806e"/>
    <text x="121" y="707" class="check">01  Capability soundness</text>
    <rect x="394" y="682" width="296" height="40" rx="10" fill="#123f3a" stroke="#2a806e"/>
    <text x="411" y="707" class="check">02  Protocol realizability</text>
    <rect x="104" y="736" width="274" height="40" rx="10" fill="#123f3a" stroke="#2a806e"/>
    <text x="121" y="761" class="check">03  Role conformance</text>
    <rect x="394" y="736" width="296" height="40" rx="10" fill="#123f3a" stroke="#2a806e"/>
    <text x="411" y="761" class="check">04  Z3 reachability</text>
  </g>

  <path d="M722 674 H806" fill="none" stroke="#48e0a4" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="826" y="535" width="664" height="90" rx="20" fill="#10362e" stroke="#48e0a4" stroke-width="2"/>
    <circle cx="872" cy="580" r="22" fill="#1c8a67"/>
    <path d="M861 580l8 8 15-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="573" class="verdict">ACHIEVABLE</text>
    <text x="910" y="599" class="verdictBody">Witness path plus explicit deferred obligations</text>

    <rect x="826" y="649" width="664" height="90" rx="20" fill="#182c43" stroke="#6ea8df" stroke-width="2"/>
    <circle cx="872" cy="694" r="22" fill="#376f9e"/>
    <text x="872" y="702" text-anchor="middle" style="font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#fff">?</text>
    <text x="910" y="687" class="verdict">UNKNOWN</text>
    <text x="910" y="713" class="verdictBody">Honest abstention outside the decidable fragment</text>

    <rect x="826" y="763" width="664" height="90" rx="20" fill="#3b1c24" stroke="#ff6b6b" stroke-width="2"/>
    <circle cx="872" cy="808" r="22" fill="#b13b4a"/>
    <path d="M864 800l16 16M880 800l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="910" y="801" class="verdict">IMPOSSIBLE</text>
    <text x="910" y="827" class="verdictBody">Blocking frontier: missing tool, unsatisfied goal, or frozen handoff</text>
  </g>

  <rect x="72" y="825" width="650" height="38" rx="10" fill="#0b1928" stroke="#2b536e"/>
  <text x="397" y="850" text-anchor="middle" class="footer">Coq guarantee: an IMPOSSIBLE verdict is never wrong for the declared pack</text>
</svg>
