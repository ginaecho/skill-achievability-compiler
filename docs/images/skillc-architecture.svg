<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">SkillC project architecture</title>
  <desc id="desc">Layered architecture showing integration surfaces, compiler front end, schema boundary, trusted checker pipeline, solver and proof foundations, and evidence outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#55d8ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4be0a6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f2bb4b"/>
    </marker>
    <style>
      .title { font: 700 44px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 19px Inter, Segoe UI, Arial, sans-serif; fill: #9eb3c9; }
      .lane { font: 700 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #8fa8bf; }
      .nodeTitle { font: 700 19px Inter, Segoe UI, Arial, sans-serif; fill: #f5f9fd; }
      .nodeBody { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #b7c7d7; }
      .tiny { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #94abc0; }
      .mono { font: 600 14px Consolas, Cascadia Mono, monospace; fill: #d7f6ff; }
      .step { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #f4fbf8; }
      .stepBody { font: 400 12px Inter, Segoe UI, Arial, sans-serif; fill: #b9d8cd; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="url(#bg)"/>
  <circle cx="1650" cy="30" r="300" fill="#174a6d" opacity=".18"/>
  <circle cx="130" cy="1090" r="280" fill="#0b5849" opacity=".13"/>

  <text x="64" y="68" class="title">SkillC reference architecture</text>
  <text x="64" y="103" class="subtitle">A portable pre-execution quality gate with an untrusted compiler front end and a small deterministic trusted core.</text>

  <rect x="64" y="138" width="1672" height="132" rx="22" fill="#0b1a2c" stroke="#294661" stroke-width="2"/>
  <text x="90" y="169" class="lane">INTEGRATION SURFACES</text>

  <g filter="url(#shadow)">
    <rect x="96" y="187" width="282" height="58" rx="14" fill="#163552" stroke="#47769d"/>
    <text x="237" y="211" text-anchor="middle" class="nodeTitle">Developer workstation</text>
    <text x="237" y="232" text-anchor="middle" class="nodeBody">Local CLI and editor</text>

    <rect x="416" y="187" width="282" height="58" rx="14" fill="#163552" stroke="#47769d"/>
    <text x="557" y="211" text-anchor="middle" class="nodeTitle">CI/CD pipeline</text>
    <text x="557" y="232" text-anchor="middle" class="nodeBody">Exit-code quality gate</text>

    <rect x="736" y="187" width="282" height="58" rx="14" fill="#163552" stroke="#47769d"/>
    <text x="877" y="211" text-anchor="middle" class="nodeTitle">Skill registry</text>
    <text x="877" y="232" text-anchor="middle" class="nodeBody">Batch scan and admission</text>

    <rect x="1056" y="187" width="282" height="58" rx="14" fill="#163552" stroke="#47769d"/>
    <text x="1197" y="211" text-anchor="middle" class="nodeTitle">Agent framework</text>
    <text x="1197" y="232" text-anchor="middle" class="nodeBody">Pre-run policy hook</text>

    <rect x="1376" y="187" width="328" height="58" rx="14" fill="#163552" stroke="#47769d"/>
    <text x="1540" y="211" text-anchor="middle" class="nodeTitle">Governance service</text>
    <text x="1540" y="232" text-anchor="middle" class="nodeBody">Evidence and compliance</text>
  </g>

  <path d="M237 245V302M557 245V302M877 245V302M1197 245V302M1540 245V302" stroke="#55d8ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="64" y="303" width="1672" height="112" rx="22" fill="#102239" stroke="#3d6b91" stroke-width="2"/>
  <text x="90" y="334" class="lane">CLI AND AUTOMATION CONTRACT</text>
  <rect x="96" y="350" width="1608" height="42" rx="12" fill="#071827" stroke="#34789a"/>
  <text x="900" y="376" text-anchor="middle" class="mono">skillc  compile  |  check  |  scan  |  audit  |  cost  |  eval  |  profiles</text>

  <path d="M900 415V453" stroke="#55d8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="64" y="454" width="1672" height="258" rx="22" fill="#091827" stroke="#294661" stroke-width="2"/>
  <text x="90" y="485" class="lane">COMPILATION AND TRUST BOUNDARY</text>

  <g filter="url(#shadow)">
    <rect x="96" y="514" width="250" height="154" rx="18" fill="#142e47" stroke="#4b789b"/>
    <text x="121" y="550" class="nodeTitle">Skill sources</text>
    <text x="121" y="579" class="nodeBody">SKILL.md</text>
    <text x="121" y="603" class="nodeBody">Agent markdown</text>
    <text x="121" y="627" class="nodeBody">Formal pack JSON</text>

    <rect x="400" y="514" width="302" height="154" rx="18" fill="#352814" stroke="#d9a338"/>
    <rect x="476" y="496" width="150" height="34" rx="17" fill="#aa710d"/>
    <text x="551" y="518" text-anchor="middle" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:1px">UNTRUSTED</text>
    <text x="425" y="550" class="nodeTitle">Compiler front end</text>
    <text x="425" y="579" class="nodeBody">Deterministic markdown parser</text>
    <text x="425" y="603" class="nodeBody">Optional LLM compaction</text>
    <text x="425" y="627" class="nodeBody">Source provenance</text>

    <rect x="756" y="514" width="274" height="154" rx="18" fill="#17324a" stroke="#55d8ff" stroke-width="2"/>
    <text x="781" y="550" class="nodeTitle">Schema gate</text>
    <text x="781" y="579" class="nodeBody">Validate structure</text>
    <text x="781" y="603" class="nodeBody">Normalize defaults</text>
    <text x="781" y="627" class="nodeBody">Compute pack digest</text>

    <rect x="1084" y="514" width="620" height="154" rx="18" fill="#0e302c" stroke="#4be0a6" stroke-width="2"/>
    <rect x="1294" y="496" width="200" height="34" rx="17" fill="#14735c"/>
    <text x="1394" y="518" text-anchor="middle" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#fff;letter-spacing:1px">TRUSTED CORE</text>
    <text x="1110" y="550" class="nodeTitle">Achievability checker</text>
    <text x="1110" y="579" class="nodeBody">Validated pack only · conservative solver policy</text>
    <rect x="1110" y="606" width="568" height="38" rx="10" fill="#08221f" stroke="#26715f"/>
    <text x="1394" y="630" text-anchor="middle" class="mono">Γ; G ⊨ ◇goal</text>
  </g>

  <path d="M346 591H392" stroke="#55d8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M702 591H748" stroke="#f2bb4b" stroke-width="4" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M1030 591H1076" stroke="#4be0a6" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>

  <line x1="1048" y1="481" x2="1048" y2="686" stroke="#8799aa" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1064" y="692" class="tiny">TRUST BOUNDARY</text>

  <rect x="64" y="750" width="1160" height="266" rx="22" fill="#0a1c2b" stroke="#2c536d" stroke-width="2"/>
  <text x="90" y="781" class="lane">CHECKER PIPELINE</text>

  <g filter="url(#shadow)">
    <rect x="96" y="816" width="240" height="112" rx="17" fill="#113d36" stroke="#3ebc90"/>
    <circle cx="126" cy="846" r="15" fill="#1b8062"/>
    <text x="126" y="851" text-anchor="middle" style="font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#fff">1</text>
    <text x="153" y="851" class="step">Capability check</text>
    <text x="120" y="879" class="stepBody">No hallucinated tools</text>
    <text x="120" y="901" class="stepBody">Owner and guard checks</text>

    <rect x="370" y="816" width="240" height="112" rx="17" fill="#113d36" stroke="#3ebc90"/>
    <circle cx="400" cy="846" r="15" fill="#1b8062"/>
    <text x="400" y="851" text-anchor="middle" style="font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#fff">2</text>
    <text x="427" y="851" class="step">Realizability</text>
    <text x="394" y="879" class="stepBody">Project global protocol</text>
    <text x="394" y="901" class="stepBody">Detect frozen handoffs</text>

    <rect x="644" y="816" width="240" height="112" rx="17" fill="#113d36" stroke="#3ebc90"/>
    <circle cx="674" cy="846" r="15" fill="#1b8062"/>
    <text x="674" y="851" text-anchor="middle" style="font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#fff">3</text>
    <text x="701" y="851" class="step">Conformance</text>
    <text x="668" y="879" class="stepBody">Compare role behaviours</text>
    <text x="668" y="901" class="stepBody">Track assumed roles</text>

    <rect x="918" y="816" width="274" height="112" rx="17" fill="#113d36" stroke="#3ebc90"/>
    <circle cx="948" cy="846" r="15" fill="#1b8062"/>
    <text x="948" y="851" text-anchor="middle" style="font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#fff">4</text>
    <text x="975" y="851" class="step">Reachability</text>
    <text x="942" y="879" class="stepBody">STRIPS state transitions</text>
    <text x="942" y="901" class="stepBody">QF-LIA queries via Z3</text>
  </g>

  <path d="M336 872H362M610 872H636M884 872H910" stroke="#4be0a6" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M1394 668V728H1055V808" stroke="#4be0a6" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <rect x="1260" y="750" width="476" height="266" rx="22" fill="#0a1c2b" stroke="#2c536d" stroke-width="2"/>
  <text x="1286" y="781" class="lane">EVIDENCE OUTPUTS</text>

  <g filter="url(#shadow)">
    <rect x="1292" y="816" width="194" height="66" rx="14" fill="#103a31" stroke="#4be0a6"/>
    <text x="1389" y="843" text-anchor="middle" class="nodeTitle">ACHIEVABLE</text>
    <text x="1389" y="864" text-anchor="middle" class="nodeBody">Witness path</text>

    <rect x="1510" y="816" width="194" height="66" rx="14" fill="#172f49" stroke="#6aa8df"/>
    <text x="1607" y="843" text-anchor="middle" class="nodeTitle">UNKNOWN</text>
    <text x="1607" y="864" text-anchor="middle" class="nodeBody">Fragment reason</text>

    <rect x="1292" y="904" width="412" height="78" rx="14" fill="#3a1d25" stroke="#ff6b6b"/>
    <text x="1498" y="934" text-anchor="middle" class="nodeTitle">IMPOSSIBLE</text>
    <text x="1498" y="957" text-anchor="middle" class="nodeBody">Reason code · blocking frontier · source location</text>
  </g>

  <path d="M1192 872H1252" stroke="#4be0a6" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <rect x="64" y="1040" width="1672" height="40" rx="14" fill="#0b1725" stroke="#29445b"/>
  <text x="90" y="1066" class="lane">ASSURANCE FOUNDATION</text>
  <text x="330" y="1066" class="nodeBody">Capability profiles</text>
  <circle cx="500" cy="1060" r="3" fill="#55d8ff"/>
  <text x="522" y="1066" class="nodeBody">Pack schema</text>
  <circle cx="650" cy="1060" r="3" fill="#55d8ff"/>
  <text x="672" y="1066" class="nodeBody">Z3 solver</text>
  <circle cx="784" cy="1060" r="3" fill="#55d8ff"/>
  <text x="806" y="1066" class="nodeBody">Coq refutation theorem</text>
  <circle cx="1028" cy="1060" r="3" fill="#55d8ff"/>
  <text x="1050" y="1066" class="nodeBody">Corpus evaluation</text>
  <circle cx="1232" cy="1060" r="3" fill="#55d8ff"/>
  <text x="1254" y="1066" class="nodeBody">Regression and soundness tests</text>
</svg>
