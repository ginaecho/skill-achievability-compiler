<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SkillC integration with VS Code and Microsoft Agent Framework</title>
  <desc id="desc">SkillC as a Microsoft developer tooling preflight, with outgoing arrows to both Visual Studio Code for live skill diagnostics and Microsoft Agent Framework for admitting achievable work.</desc>
  <metadata>
    Official Visual Studio Code icon: https://code.visualstudio.com/assets/branding/visual-studio-code-icons.zip
    Official Microsoft Agent Framework icon: https://github.com/microsoft/agent-framework/blob/main/docs/assets/SVG/Microsoft%20Foundry%20Agent%20Framework%20-%20Color.svg
    Product names and icons are trademarks of their respective owners. This diagram depicts proposed integrations, not Microsoft endorsement.
  </metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243e"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d4038"/>
      <stop offset="1" stop-color="#092923"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 Z" fill="#55d8ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 Z" fill="#4be0a6"/>
    </marker>
    <style>
      .title { font: 800 46px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .label { font: 700 17px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; fill: #55d8ff; }
      .node { font: 750 34px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .body { font: 400 19px Inter, Segoe UI, Arial, sans-serif; fill: #b8c8d8; }
      .logo { font: 700 86px Consolas, Cascadia Mono, monospace; }
      .outcome { font: 750 20px Inter, Segoe UI, Arial, sans-serif; fill: #f7fbff; }
      .footer { font: 700 24px Inter, Segoe UI, Arial, sans-serif; fill: #d7e5f2; }
      .small { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #7f98ad; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="30" r="300" fill="#174a6d" opacity=".18"/>
  <circle cx="50" cy="880" r="300" fill="#0b5849" opacity=".14"/>

  <text x="800" y="112" text-anchor="middle" class="title">SkillC as a Microsoft Developer Tooling Preflight</text>

  <g filter="url(#shadow)">
    <rect x="90" y="248" width="380" height="310" rx="34" fill="#102a43" stroke="#4b789b" stroke-width="3"/>
    <image x="220" y="275" width="120" height="120" href="data:image/svg+xml;base64," aria-label="Official Visual Studio Code icon"/>
    <text x="280" y="432" text-anchor="middle" class="label">AUTHOR</text>
    <text x="280" y="480" text-anchor="middle" class="node">VS Code</text>
    <text x="280" y="522" text-anchor="middle" class="body">Live skill diagnostics</text>
  </g>

  <path d="M630 403H490" stroke="#55d8ff" stroke-width="7" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="630" y="278" width="340" height="250" rx="42" fill="url(#core)" stroke="#4be0a6" stroke-width="4"/>
    <text x="800" y="397" text-anchor="middle" class="logo"><tspan fill="#55d8ff">skill</tspan><tspan fill="#f7fbff">c</tspan></text>
    <text x="800" y="457" text-anchor="middle" class="label" fill="#4be0a6">ACHIEVABILITY PREFLIGHT</text>
  </g>

  <path d="M970 403H1110" stroke="#4be0a6" stroke-width="7" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="1130" y="248" width="380" height="310" rx="34" fill="#102a43" stroke="#4b789b" stroke-width="3"/>
    <image x="1260" y="275" width="120" height="120" href="data:image/svg+xml;base64," aria-label="Official Microsoft Agent Framework icon"/>
    <text x="1320" y="432" text-anchor="middle" class="label">RUN</text>
    <text x="1320" y="472" text-anchor="middle" class="node">Microsoft Agent</text>
    <text x="1320" y="508" text-anchor="middle" class="node">Framework</text>
    <text x="1320" y="539" text-anchor="middle" class="body">Only admitted work</text>
  </g>

  <rect x="330" y="660" width="430" height="64" rx="20" fill="#3a1d25" stroke="#ff6b6b" stroke-width="2"/>
  <text x="545" y="700" text-anchor="middle" class="outcome">IMPOSSIBLE → BLOCK</text>

  <rect x="840" y="660" width="430" height="64" rx="20" fill="#10372f" stroke="#4be0a6" stroke-width="2"/>
  <text x="1055" y="700" text-anchor="middle" class="outcome">ACHIEVABLE → RUN</text>

  <text x="800" y="798" text-anchor="middle" class="footer">One compiler. Two integration points.</text>
  <text x="800" y="858" text-anchor="middle" class="small">Product concept · integration opportunity, not an announced Microsoft roadmap</text>
</svg>
